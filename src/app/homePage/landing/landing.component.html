        <h1>JOHN</h1>
        <h1>GABRIEL</h1>
        <h1>PEREZ</h1> &nbsp;

  <div class="mobile">
      <div class="profile-container-mobile mt-2">
        <div class="profile-img-container-mobile">
          <img [src]="homeHeader1" alt="">
        </div>
      </div>
  </div>

  <div class="desktop">
    <div class="profile-container-desktop-parent">
      <div class="profile-container-desktop mt-3">
        <div class="profile-img-container-desktop">
          <img [src]="homeHeader1" alt="">
        </div>
        <div class="logo-img-container">
          <img [src]="logo" alt="">
        </div>
     </div>
      
     <div class="profile-features">
      <div class="carousel-container mt-5">
        <div id="carouselExampleInterval" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-inner">
            <div class="carousel-item active" data-bs-interval="10000">
              <img src="images/me.jpg" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item" data-bs-interval="2000">
              <img src="images/dayo.jpg" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
              <img src="images/chooman.jpg" class="d-block w-100" alt="...">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
    </div>
    
      <div class="btn-container mt-3">
        <a href="/files/resume/JohnGabrielPerez_Resume.pdf" download class="btn" class="btn"><p>DOWNLOAD RESUME</p></a>
